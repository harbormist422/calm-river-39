<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, nofollow, noarchive"/>
<title>Loading</title>
<style>
body{font-family:system-ui;margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f5f5f5;}
.box{background:#fff;padding:32px;border-radius:16px;text-align:center;max-width:320px;box-shadow:0 2px 12px rgba(0,0,0,.08);}
.spin{width:32px;height:32px;border:3px solid #ddd;border-top-color:#333;border-radius:50%;margin:0 auto 16px;animation:sp 0.8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
#gate{display:none;}
#gate button{padding:12px 24px;font-size:16px;border:1px solid #ccc;border-radius:10px;background:#fff;cursor:pointer;}
#gate button:active{background:#eee;}
</style>
</head>
<body>
<div class="box" id="loading">
<div class="spin"></div>
<p>Loading...</p>
</div>
<div class="box" id="gate">
<p>Tap to continue</p>
<button id="enter">Continue</button>
</div>
<script>
// Anti-bot: googlebot / crawlers get stuck on loading, never see app.
// Real users: first visit tap once, saved in localStorage forever, never ask again.
(function(){
  var ua=navigator.userAgent||'';
  var isBot=/bot|crawl|spider|slurp|mediapartners|google|bing|yandex|baidu|duckduck|semrush|ahrefs|mj12|pagespeed|lighthouse|headless|phantom|selenium/i.test(ua);
  // webdriver / headless extra signals
  if(navigator.webdriver) isBot=true;
  if(isBot){
    // stay on loading forever, do nothing
    return;
  }
  // already passed before? go straight to app, no tap needed
  try{
    if(localStorage.getItem('gate_ok')==='1'){
      window.location.replace('/app');
      return;
    }
  }catch(e){}
  setTimeout(function(){
    document.getElementById('loading').style.display='none';
    document.getElementById('gate').style.display='block';
  }, 1200);
  document.getElementById('enter').onclick=function(){
    try{localStorage.setItem('gate_ok','1');}catch(e){}
    window.location.href='/app';
  };
})();
</script>
</body>
</html>
